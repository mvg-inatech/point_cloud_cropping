name: kp_next
dataset_name: paris_lille_3d
save_dir: results/kp_next_sphere_12_paris_lille_3d
dataset_config:
  dataset_type: large_scale
  loops: 1
  voxel_size: 0.1 # match this with the MODEL voxel size!!!
  voxel_size_preprocessing: 0.05
  grid_overlay: 5
  train_dir: /data/train/
  val_dir: /data/val/
  apply_transforms: True
  lambda_p: 12 # either prob for exponent, std for distance in m or range value in meter for radius or box dim
  use_lambda_range: False
  lambda_range: # lambda uniform range between lambda - [0], lambda + [1]
    - 0.4
    - 0.4
  ending: .ply
  sub_cloud_method: sphere
  min_appearance: 1.2
  min_pts: 500
  feat_list:
    - coords
train:
  bs: 4
  accumulation_steps: 4
  max_lr:
    - 0.005
  mom: 0.9
  wd: 0.05
  ep: 100
  gamma: 0.98
  clip_gradient: 3
  nr_workers: 4
loss:
  name: cross_entropy
  label_smoothing: 0.05
  weight: null
  ignore_index: -1
  weight_factor: 1.0
model_config:
  in_channels: 6
  nr_classes: 13
  voxel_size: 0.04
  radius: 2.3
  shell_sizes:
    - 1
    - 14
    - 28
  stride:
    - 2
    - 2
    - 2
    - 2
  enc_depths:
    - 2
    - 4
    - 4
    - 12
    - 4
  enc_channels:
    - 64
    - 96
    - 128
    - 256
    - 384
  enc_groups:
    - 0
    - 0
    - 0
    - 0
    - 0
  enc_neighbours:
    - 12
    - 16
    - 20
    - 20
    - 20
  dec_channels:
    - 96
    - 128
    - 256
    - 384
  drop_path_rate: 0.3
  influence_mode: "linear"
  attention_act: "sigmoid"
  enable_checkpoints: False